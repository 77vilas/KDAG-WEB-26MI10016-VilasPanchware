<html>
    <head>
        <title> REGISTRATION</title>
        <style>
            body {
                background-color: black;
                color: white;
                font-family: monospace;
                ;
            }

            #form {
                width: 400px;
                height: 600px;
                background-color: rgba(34, 33, 33, 0.698);
                
                border-radius: 30px;

                margin: 20vh auto 0 auto;
                padding: 20px;

            }

            #title {
                
                text-align: center;
                font-size: 30px;
                width: 400px;
                font-family: monospace;
                margin-top: 40px;
                margin-bottom: 50px;
            }

            #form button {
                padding: 10px;
                border: none;
                background-color: rgba(255, 0, 0, 0.6);
                width: 100%;
                color: white;

                margin-top: 10px;
            }

            .input-control {
                display: flex;
                flex-direction: column;
                margin-top: 40px;
            }

            .input-control input {
                
                border: none;
                font-size: 23px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.417);
                background-color: transparent;
                
                color: white;
                
            }

            #dept {
                background-color: transparent;
                color: white;
                border: none;
                font-size: 23px;

            }

            .input-control input::placeholder {
                color: rgba(255, 255, 255, 0.33);
                font-size: 23px;
            }

            .input-control input:focus {
                outline: 0;
            }

            .input-control.success input {
                border-bottom-color: rgb(127, 255, 195);
            }

            .input-control.error input {
                border-bottom-color: rgb(255, 0, 72);
            }

            .input-control select:invalid {
                color: #888888;
            }
           
            .input-control select option {
                color: #ffffff;
                background-color: #000000;
            }

        </style>

        <script>


            const form = document.getElementById('form');
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const roll = document.getElementById('roll');

            form.addEventListener('submit', e => {
                e.preventDefault();

                validateInputs();
            });

            const setError = (element, message) => {
                const inputControl = element.parentElement;
                const errorDisplay = inputControl.querySelector('.error');

                errorDisplay.innerText = message;
                inputControl.classList.add('error');
                inputControl.classList.remove('success')
            }

            const setSuccess = element => {
                const inputControl = element.parentElement;
                const errorDisplay = inputControl.querySelector('.error');

                errorDisplay.innerText = '';
                inputControl.classList.add('success');
                inputControl.claassList.remove('error');

            }

            const validateInputs = () => {
                const nameValue = name.value.trim();
                const emailValue = email.value.trim();
                const rollValue = roll.value.trim();

                if(name = '') {
                    setError(name, 'Name is required');
                } else {
                    setSuccess(name);
                }
            };
            


        </script>

    </head>

    <body>
        <div class="container">
            <form action="" id="form">
                <div id="title">REGISTRATION FORM</div> <hr>
                <div class="input-control">
                    
                    <input type="text" name="name" id="name" placeholder="Name">
                    <div class="error"></div>
                </div>

                <div class="input-control">
                    
                    <input type="text" name="name" id="email" placeholder="Email-id">
                    <div class="error"></div>
                </div>

                <div class="input-control">
                    
                    <input type="text" name="roll" id="roll" placeholder="Roll No.">
                    <div class="error"></div>
                </div>

                <div class="input-control">
                    
                    <select name="department" id="dept" >
                        <option value=" ">Department</option>
                        <option value="MI">MI</option>
                        <option value="AE">AE</option>
                        <option value="CE">CE</option>
                        <option value="AI">AI</option>
                        <option value="EX">EX</option>
                        <option value="CS">CS</option>
                        <option value="GG">GG</option>
                        <option value="CH">CH</option>
                        <option value="MT">MT</option>
                    </select>
                    <div class="error"></div>

                    <button style="margin-top: 100px;">Register</button>
                </div>

            </form>
        </div>
    </body>
</html>
