<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REGISTRATION</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace;
        }

        #form {
            width: 400px;
            height: auto;
            min-height: 600px;
            background-color: rgba(34, 33, 33, 0.698);
            border-radius: 30px;
            margin: 10vh auto 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        #title {
            text-align: center;
            font-size: 26px;
            font-family: monospace;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #form button {
            padding: 10px;
            border: none;
            background-color: rgba(255, 0, 0, 0.6);
            width: 100%;
            color: white;
            margin-top: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }

        .input-control {
            display: flex;
            flex-direction: column;
            margin-top: 25px;
            position: relative;
        }

        .input-control input, 
        .input-control select {
            border: none;
            font-size: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.417);
            background-color: transparent;
            color: white;
            outline: none;
            font-family: inherit;
            padding: 5px 0;
        }

        .input-control input::placeholder {
            color: rgba(255, 255, 255, 0.33);
            font-size: 20px;
        }

       
        .input-control select:invalid {
            color: rgba(255, 255, 255, 0.33);
        }

        .input-control select option {
            color: #ffffff;
            background-color: #000000;
        }

        .input-control.success input,
        .input-control.success select {
            border-bottom-color: rgb(127, 255, 195);
        }

        .input-control.error input,
        .input-control.error select {
            border-bottom-color: rgb(255, 0, 72);
        }

        
        .error {
            color: rgb(255, 0, 72);
            font-size: 13px;
            min-height: 20px; 
            margin-top: 5px;
            line-height: 1.2;
        }
    </style>
</head>

<body>
    <div class="container">
        <form id="form">
            <div id="title">REGISTRATION FORM</div> 
            <hr>

            <div class="input-control">
                <input type="text" name="name" id="name" placeholder="Name">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <input type="text" name="email" id="email" placeholder="Email-id">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <input type="text" name="roll" id="roll" placeholder="Roll No.">
                <div class="error"></div>
            </div>

            <div class="input-control">
                <select name="department" id="dept" required>
                    <option value="" disabled selected hidden>Department</option>
                    <option value="MI">MI</option>
                    <option value="AE">AE</option>
                    <option value="CE">CE</option>
                    <option value="AI">AI</option>
                    <option value="EX">EX</option>
                    <option value="CS">CS</option>
                    <option value="GG">GG</option>
                    <option value="CH">CH</option>
                    <option value="MT">MT</option>
                    <option value="AG">AG</option>
                    <option value="AR">AR</option>
                    <option value="BT">BT</option>
                    <option value="CY">CY</option>
                    <option value="SD">SD</option>
                    <option value="EE">EE</option>
                    <option value="EC">EC</option>
                    <option value="IM">IM</option>
                    <option value="MA">MA</option>
                    <option value="ME">ME</option>
                    <option value="NA">NA</option>
                    <option value="PH">PH</option>
                </select>
                <div class="error"></div>
            </div>

            <button type="submit">Register</button>
        </form>
    </div>

    
    <script>
        const form = document.getElementById('form');
        const username = document.getElementById('name');
        const email = document.getElementById('email');
        const roll = document.getElementById('roll');
        const dept = document.getElementById('dept');

        form.addEventListener('submit', e => {
            e.preventDefault();
            validateInputs();
        });

        const setError = (element, message) => {
            const inputControl = element.parentElement;
            const errorDisplay = inputControl.querySelector('.error');

            errorDisplay.innerText = message;
            inputControl.classList.add('error');
            inputControl.classList.remove('success');
        };

        const setSuccess = element => {
            const inputControl = element.parentElement;
            const errorDisplay = inputControl.querySelector('.error');

            errorDisplay.innerText = '';
            inputControl.classList.add('success');
            inputControl.classList.remove('error');
        };

        const isValidEmail = emailStr => {
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(emailStr).toLowerCase());
        };

        const validateInputs = () => {
            const nameValue = username.value.trim();
            const emailValue = email.value.trim();
            const rollValue = roll.value.trim();
            const deptValue = dept.value;

            
            if (nameValue === '') {
                setError(username, 'Name is required');
            } else {
                setSuccess(username);
            }

            
            if (emailValue === '') {
                setError(email, 'Email is required');
            } else if (!isValidEmail(emailValue)) {
                setError(email, 'Provide a valid email address');
            } else {
                setSuccess(email);
            }

            
            if (rollValue === '') {
                setError(roll, 'Roll no is required');
            } else if (rollValue.length !== 9) {
                setError(roll, 'Roll no must contain 9 characters');
            } else {
                setSuccess(roll);
            }

            
            if (deptValue === '') {
                setError(dept, 'Please select a department');
            } else {
                setSuccess(dept);
            }
        };
    </script>
</body>
</html>
